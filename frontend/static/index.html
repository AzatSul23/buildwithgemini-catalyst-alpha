<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CatalystAlpha | Event-Driven Market Intelligence</title>
<!-- Google Fonts & Material Symbols -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
  :root { 
    --primary: #059669; 
    --primary-hover: #047857; 
    --primary-light: #d1fae5;
    --primary-glow: rgba(5, 150, 105, 0.18);
    --bg-main: #f4fbf7; 
    --chat-bg: #ffffff;
    --border-color: #e2ece6;
    --border-subtle: #edf5f0; 
    --header-bg: #064e3b;
    --header-text: #f0fdf4;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --card-shadow: 0 10px 25px -5px rgba(6, 78, 59, 0.07), 0 8px 10px -6px rgba(6, 78, 59, 0.04);
  }
  * { box-sizing: border-box; }
  body { 
    margin: 0; 
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; 
    background: var(--bg-main); 
    background-image: radial-gradient(circle at 10% 20%, rgba(16, 185, 129, 0.05) 0%, transparent 40%),
                      radial-gradient(circle at 90% 80%, rgba(5, 150, 105, 0.05) 0%, transparent 40%);
    display: flex; 
    flex-direction: column; 
    align-items: center;
    height: 100vh; 
    overflow: hidden;
  }

  /* App Shell & Layout */
  .app-container {
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 960px;
    height: 100vh;
    padding: 12px 16px 16px 16px;
  }

  /* Header */
  header { 
    background: linear-gradient(135deg, #064e3b 0%, #065f46 100%); 
    color: var(--header-text); 
    padding: 0.9rem 1.4rem; 
    border-radius: 16px 16px 0 0;
    display: flex; 
    align-items: center; 
    justify-content: space-between; 
    box-shadow: 0 4px 12px rgba(6, 78, 59, 0.12);
  }
  .header-brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .brand-logo {
    width: 36px;
    height: 36px;
    background: rgba(255, 255, 255, 0.15);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.25rem;
  }
  .brand-title {
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .brand-badge {
    font-size: 0.72rem;
    font-weight: 600;
    background: #10b981;
    color: #064e3b;
    padding: 2px 8px;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .status-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.8rem;
    color: #a7f3d0;
  }
  .status-dot {
    width: 8px;
    height: 8px;
    background: #34d399;
    border-radius: 50%;
    box-shadow: 0 0 8px #34d399;
  }

  /* Chat Window Frame */
  .chat-frame {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: var(--chat-bg);
    border-left: 1px solid var(--border-color);
    border-right: 1px solid var(--border-color);
    border-bottom: 1px solid var(--border-color);
    border-radius: 0 0 16px 16px;
    box-shadow: var(--card-shadow);
    overflow: hidden;
  }

  /* Quick Actions Bar */
  .quick-bar {
    display: flex;
    gap: 0.5rem;
    padding: 0.6rem 1.2rem;
    background: #f8fbf9;
    border-bottom: 1px solid var(--border-subtle);
    overflow-x: auto;
    white-space: nowrap;
  }
  .quick-chip {
    padding: 0.35rem 0.8rem;
    border-radius: 20px;
    background: #ffffff;
    border: 1px solid var(--border-color);
    font-size: 0.78rem;
    font-weight: 500;
    color: #065f46;
    cursor: pointer;
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .quick-chip:hover {
    background: var(--primary-light);
    border-color: #a7f3d0;
    transform: translateY(-1px);
  }

  /* Log & Messages */
  #log { 
    flex: 1; 
    overflow-y: auto; 
    padding: 1.4rem; 
    display: flex;
    flex-direction: column;
    gap: 1rem;
    scroll-behavior: smooth;
  }
  .msg { 
    display: flex; 
    gap: 0.75rem; 
    max-width: 85%; 
    animation: fadeIn 0.25s ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.user { 
    align-self: flex-end; 
    flex-direction: row-reverse; 
  }
  .msg.agent { 
    align-self: flex-start; 
  }
  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.9rem;
    font-weight: 600;
    flex-shrink: 0;
  }
  .msg.user .avatar {
    background: var(--primary-hover);
    color: #ffffff;
  }
  .msg.agent .avatar {
    background: #e6f4ea;
    color: var(--primary);
    border: 1px solid #a7f3d0;
  }

  .bubble { 
    padding: 0.95rem 1.25rem; 
    border-radius: 16px; 
    background: #ffffff; 
    border: 1px solid var(--border-color); 
    text-align: left; 
    color: var(--text-main);
    line-height: 1.65;
    font-size: 0.94rem;
    box-shadow: 0 2px 8px rgba(0,0,0,0.03);
  }
  .msg.user .bubble { 
    background: linear-gradient(135deg, #059669 0%, #047857 100%); 
    color: #ffffff; 
    border: none; 
    border-top-right-radius: 4px;
    box-shadow: 0 4px 10px rgba(5, 150, 105, 0.25);
    white-space: pre-wrap;
  }
  .msg.agent .bubble {
    border-top-left-radius: 4px;
  }
  .bubble.rich { 
    background: transparent; 
    border: none; 
    padding: 0; 
    max-width: 100%; 
    box-shadow: none;
  }
  /* Formatted markdown text in agent bubbles */
  .bubble-content p {
    margin: 0 0 0.85rem 0;
  }
  .bubble-content p:last-child {
    margin-bottom: 0;
  }
  .bubble-content ul, .bubble-content ol {
    margin: 0.4rem 0 0.85rem 1.2rem;
    padding: 0;
  }
  .bubble-content li {
    margin-bottom: 0.4rem;
    line-height: 1.6;
  }
  .bubble-content strong {
    font-weight: 700;
    color: #064e3b;
  }
  .bubble-content hr {
    border: none;
    border-top: 1px solid #e2ece6;
    margin: 1rem 0;
  }
  .bubble-content h1, .bubble-content h2, .bubble-content h3, .bubble-content h4 {
    color: #064e3b;
    margin: 1rem 0 0.5rem 0;
    font-weight: 700;
  }
  .bubble-content h3 { font-size: 1.1rem; }
  .bubble-content h4 { font-size: 1rem; }

  /* Animated Thinking Dots */
  .thinking-container {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 4px 6px;
    min-height: 24px;
  }
  .thinking-dot {
    width: 8px;
    height: 8px;
    background: var(--primary);
    border-radius: 50%;
    animation: pulseDot 1.4s infinite ease-in-out both;
  }
  .thinking-dot:nth-child(1) { animation-delay: -0.32s; }
  .thinking-dot:nth-child(2) { animation-delay: -0.16s; }
  .thinking-dot:nth-child(3) { animation-delay: 0s; }

  @keyframes pulseDot {
    0%, 80%, 100% { 
      transform: scale(0.4);
      opacity: 0.35;
    }
    40% { 
      transform: scale(1);
      opacity: 1;
      background: #047857;
    }
  }

  /* Input form area */
  form { 
    display: flex; 
    gap: 0.75rem; 
    padding: 1rem 1.4rem; 
    border-top: 1px solid var(--border-color); 
    background: #ffffff; 
    align-items: center;
  }
  .input-wrapper {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
  }
  input { 
    width: 100%; 
    padding: 0.85rem 1.15rem; 
    border: 1.5px solid var(--border-color); 
    border-radius: 12px; 
    font-size: 0.95rem; 
    font-family: inherit;
    outline: none; 
    background: #fbfdfc;
    transition: all 0.2s ease;
  }
  input:focus { 
    border-color: var(--primary); 
    background: #ffffff;
    box-shadow: 0 0 0 3px var(--primary-glow); 
  }
  button { 
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 0.85rem 1.4rem; 
    border: none; 
    border-radius: 12px; 
    background: linear-gradient(135deg, #059669 0%, #047857 100%); 
    color: #ffffff; 
    font-weight: 600; 
    font-size: 0.95rem;
    font-family: inherit;
    cursor: pointer; 
    transition: all 0.2s ease; 
    box-shadow: 0 3px 8px rgba(5, 150, 105, 0.25);
  }
  button:hover { 
    background: linear-gradient(135deg, #047857 0%, #065f46 100%); 
    transform: translateY(-1px);
    box-shadow: 0 5px 12px rgba(5, 150, 105, 0.35);
  }
  button:active {
    transform: translateY(0);
  }

  /* A2UI Component Styles */
  .a2card { 
    border: 1.5px solid #a7f3d0; 
    border-radius: 16px; 
    padding: 1.3rem; 
    background: linear-gradient(180deg, #ffffff 0%, #fafffc 100%); 
    box-shadow: 0 4px 14px rgba(6, 78, 59, 0.08); 
    max-width: 100%; 
  }
  .a2card + .a2card, .a2col > .a2card { margin-top: 0.75rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.5rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.5; color: var(--text-main); }
  .a2text.a2-h1 { font-size: 1.4rem; font-weight: 700; color: #064e3b; letter-spacing: -0.01em; }
  .a2text.a2-h2 { font-size: 1.25rem; font-weight: 700; color: #064e3b; }
  .a2text.a2-h3 { font-size: 1.1rem; font-weight: 600; color: #065f46; }
  .a2text.a2-h4 { font-size: 0.98rem; font-weight: 600; color: #047857; }
  .a2text.a2-caption { font-size: 0.82rem; color: var(--text-muted); }
  .a2divider { border: none; border-top: 1px solid #d1fae5; margin: 0.5rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 12px; display: block; border: 1.5px solid #a7f3d0; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.25rem; line-height: 1; vertical-align: middle; color: var(--primary); }

  /* Scrollbar custom styling */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
</style>
</head>
<body>

<div class="app-container">
  <!-- Header with Brand & Live Status -->
  <header>
    <div class="header-brand">
      <div class="brand-logo">📈</div>
      <div>
        <div class="brand-title">CatalystAlpha <span class="brand-badge">PRO</span></div>
      </div>
    </div>
    <div class="status-indicator">
      <div class="status-dot"></div>
      <span>Agent Ready</span>
    </div>
  </header>

  <!-- Modern Chat Container -->
  <div class="chat-frame">
    <!-- Quick Catalyst Prompts -->
    <div class="quick-bar">
      <div class="quick-chip" onclick="sendPrompt('hi, what can you do?')">✨ What can you do?</div>
      <div class="quick-chip" onclick="sendPrompt('What is the current stock price and news for NVDA?')">📊 Quote NVDA</div>
      <div class="quick-chip" onclick="sendPrompt('Show me macro prediction market odds for interest rate cuts')">🎯 Macro Odds</div>
      <div class="quick-chip" onclick="sendPrompt('Give me a funny trade thesis with a cartoon meme for TSLA')">🎨 Meme Thesis TSLA</div>
    </div>

    <!-- Message History -->
    <div id="log"></div>

    <!-- Chat Input Form -->
    <form id="form">
      <div class="input-wrapper">
        <input id="input" placeholder="Type a stock ticker, event, or catalyst..." autocomplete="off" autofocus>
      </div>
      <button type="submit">
        <span>Send</span>
        <span class="material-symbols-outlined" style="font-size:1.1rem; color:#fff;">send</span>
      </button>
    </form>
  </div>
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function el(tag, cls, text) { 
  const e = document.createElement(tag); 
  if (cls) e.className = cls; 
  if (text != null) e.textContent = text; 
  return e; 
}

function bubble(who) {
  const m = el("div", "msg " + who);
  const avatar = el("div", "avatar", who === "user" ? "You" : "CA");
  const b = el("div", "bubble");
  m.appendChild(avatar);
  m.appendChild(b);
  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
  return b;
}

function setThinkingDots(b) {
  b.innerHTML = `
    <div class="thinking-container">
      <div class="thinking-dot"></div>
      <div class="thinking-dot"></div>
      <div class="thinking-dot"></div>
    </div>
  `;
}

function sendPrompt(text) {
  input.value = text;
  form.dispatchEvent(new Event('submit', { cancelable: true }));
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * Renders Card / Column / Row / Text / Divider / List / Image / Icon.
 * -------------------------------------------------------------------------- */
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { 
  return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); 
}

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      const rawText = boundStr(props.text);
      if (window.marked && window.DOMPurify && (rawText.includes("**") || rawText.includes("•") || rawText.includes("\n"))) {
        t.innerHTML = DOMPurify.sanitize(marked.parse(rawText));
      } else {
        t.textContent = rawText;
      }
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n\n").trim();
  if (textStr) {
    const textNode = el("div", "bubble-content");
    if (window.marked && window.DOMPurify) {
      // Configure marked for clean breaks
      marked.setOptions({ breaks: true, gfm: true });
      textNode.innerHTML = DOMPurify.sanitize(marked.parse(textStr));
    } else {
      textNode.textContent = textStr;
    }
    b.appendChild(textNode);
  }

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

// Initial welcome greeting
window.addEventListener("DOMContentLoaded", () => {
  const b = bubble("agent");
  b.innerHTML = `Welcome to <b>CatalystAlpha Intelligence</b>! 📈<br>Ask for stock catalysts, earnings analysis, prediction market odds, or generate a Wall Street cartoon meme thesis.`;
});

// The proxy returns { parts: [{kind:"text",text} | {kind:"a2ui",data}] }.
form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent"); 
  setThinkingDots(b);
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});
</script>
</body>
</html>
